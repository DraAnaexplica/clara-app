<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel de Controle - Tokens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { padding: 30px; background-color: #f8f9fa; }
    code { word-break: break-word; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="mb-4">Painel de Controle - Tokens</h2>

    <!-- FORMULÁRIO DE CRIAÇÃO -->
    <form id="form-criar-token" class="d-flex flex-wrap gap-2 mb-4">
      <input type="text" id="descricao" class="form-control" placeholder="Descrição (ex: João, API)" required>
      <input type="date" id="expira_em" class="form-control" required>
      <button type="submit" class="btn btn-success">Criar Token</button>
    </form>

    <div id="mensagem" class="mb-4 text-success fw-bold"></div>

    <!-- TABELA DE TOKENS -->
    <table class="table table-bordered table-hover shadow-sm bg-white">
      <thead class="table-light">
        <tr>
          <th>Token</th>
          <th>Descrição</th>
          <th>Expira em</th>
          <th>Status</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for token, expira_em, descricao in tokens %}
        <tr>
          <td><code>{{ token }}</code></td>
          <td>{{ descricao or '-' }}</td>
          <td>{{ expira_em }}</td>
          <td>
            {% if expira_em >= now|string %}
              <span class="badge bg-success">Ativo</span>
            {% else %}
              <span class="badge bg-danger">Expirado</span>
            {% endif %}
          </td>
          <td class="d-flex gap-1 flex-wrap">
            <!-- Atualizar validade -->
            <form method="POST" action="/atualizar_token" class="d-flex gap-1">
              <input type="hidden" name="token" value="{{ token }}">
              <input type="date" name="nova_data" class="form-control form-control-sm" required>
              <button type="submit" class="btn btn-sm btn-warning">Atualizar</button>
            </form>

            <!-- Excluir -->
            <form method="POST" action="/excluir_token">
              <input type="hidden" name="token" value="{{ token }}">
              <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>

  <script>
    async function gerarTokenSeguro() {
      const array = new Uint8Array(32);
      crypto.getRandomValues(array);
      return btoa(String.fromCharCode(...array))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    document.getElementById("form-criar-token").addEventListener("submit", async (e) => {
      e.preventDefault();

      const descricao = document.getElementById("descricao").value.trim();
      const expira_em = document.getElementById("expira_em").value;
      const msgDiv = document.getElementById("mensagem");

      msgDiv.textContent = "";
      msgDiv.classList.remove("text-danger", "text-success");

      if (!descricao || !expira_em) {
        msgDiv.textContent = "❌ Preencha todos os campos.";
        msgDiv.classList.add("text-danger");
        return;
      }

      const token = await gerarTokenSeguro();

      try {
        const resp = await fetch("/api/registrar_token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token,
            descricao,
            expira_em,
            api_key: "7641a7810352258950835554253caaf8"  // sua API KEY aqui
          })
        });

        const data = await resp.json();

        if (resp.ok) {
          msgDiv.innerHTML = `✅ Token criado:<br><code>${token}</code>`;
          msgDiv.classList.add("text-success");

          // Recarrega após criação
          setTimeout(() => location.reload(), 1500);
        } else {
          msgDiv.textContent = `❌ Erro: ${data.erro || "Desconhecido"}`;
          msgDiv.classList.add("text-danger");
        }
      } catch (err) {
        console.error("Erro:", err);
        msgDiv.textContent = "❌ Falha ao conectar ao servidor.";
        msgDiv.classList.add("text-danger");
      }
    });
  </script>
</body>
</html>
