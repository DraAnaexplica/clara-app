<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Painel de Controle - Tokens</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body { padding: 30px; background-color: #f8f9fa; }
    h2 { margin-bottom: 20px; }
    .form-inline .form-control { margin-right: 10px; }
    code { word-break: break-all; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Painel de Controle - Tokens</h2>

    <!-- FORMULÁRIO DE CRIAÇÃO -->
    <form id="form-criar-token" class="form-inline d-flex mb-4">
      <input type="text" id="descricao" class="form-control me-2" placeholder="Descrição (ex: João, API)" required>
      <input type="date" id="expira_em" class="form-control me-2" required>
      <button type="submit" class="btn btn-success">Criar Token</button>
    </form>

    <div id="mensagem" class="mb-4 text-success"></div>

    <!-- OPÇÕES -->
    <p class="text-muted">Os tokens criados são enviados diretamente para o servidor da Clara.</p>
  </div>

  <script>
    async function gerarTokenSeguro() {
      const array = new Uint8Array(32);
      crypto.getRandomValues(array);
      return btoa(String.fromCharCode(...array))
        .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    }

    document.getElementById("form-criar-token").addEventListener("submit", async (e) => {
      e.preventDefault();

      const descricao = document.getElementById("descricao").value.trim();
      const expira_em = document.getElementById("expira_em").value;
      const msgDiv = document.getElementById("mensagem");

      msgDiv.textContent = "";
      if (!descricao || !expira_em) {
        msgDiv.textContent = "❌ Preencha todos os campos.";
        msgDiv.classList.add("text-danger");
        return;
      }

      const token = await gerarTokenSeguro();

      try {
        const resp = await fetch("https://clara-app.onrender.com/api/registrar_token", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            token,
            descricao,
            expira_em,
            api_key: "7641a7810352258950835554253caaf8"  // 🔐 Troque por seu valor real
          })
        });

        const data = await resp.json();

        if (resp.ok) {
          msgDiv.innerHTML = `✅ Token criado e enviado com sucesso:<br><code>${token}</code>`;
          msgDiv.classList.remove("text-danger");
          msgDiv.classList.add("text-success");
        } else {
          msgDiv.textContent = `❌ Erro: ${data.erro || "Desconhecido"}`;
          msgDiv.classList.add("text-danger");
        }
      } catch (err) {
        console.error("Erro:", err);
        msgDiv.textContent = "❌ Falha ao conectar ao servidor.";
        msgDiv.classList.add("text-danger");
      }
    });
  </script>
</body>
</html>
