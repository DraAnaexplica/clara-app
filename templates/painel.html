<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Controle - Tokens</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container mt-5">
    <h2 class="mb-4 text-center">🔐 Painel de Controle - Tokens</h2>

    <!-- Formulário de criação -->
    <form method="POST" class="row g-2 mb-4">
      <div class="col-md-5">
        <input type="text" name="novo_token" class="form-control" placeholder="Novo Token" required />
      </div>
      <div class="col-md-4">
        <input type="date" name="expira_em" class="form-control" required />
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-success w-100">+ Adicionar Token</button>
      </div>
    </form>

    <!-- Tabela de tokens -->
    {% if tokens %}
    <table class="table table-bordered table-hover">
      <thead class="table-dark">
        <tr>
          <th>Token</th>
          <th>Expira em</th>
          <th style="width: 200px">Ações</th>
        </tr>
      </thead>
      <tbody>
        {% for token, expira_em in tokens %}
        <tr>
          <td>{{ token }}</td>
          <td>
            <form method="POST" action="/atualizar_token" class="d-flex">
              <input type="hidden" name="token" value="{{ token }}" />
              <input type="date" name="nova_data" class="form-control me-2" value="{{ expira_em }}" required />
              <button type="submit" class="btn btn-primary btn-sm">Atualizar</button>
            </form>
          </td>
          <td>
            <form method="POST" action="/excluir_token">
              <input type="hidden" name="token" value="{{ token }}" />
              <button type="submit" class="btn btn-danger btn-sm w-100">Excluir</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
    {% else %}
    <p class="text-muted">Nenhum token cadastrado ainda.</p>
    {% endif %}

    <!-- Botões de backup -->
    <div class="mt-4 d-flex gap-2">
      <a href="/exportar_tokens" class="btn btn-outline-secondary">📤 Exportar Tokens</a>
      <a href="/importar_tokens" class="btn btn-outline-secondary">📥 Importar Tokens</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
