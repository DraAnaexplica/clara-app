<!DOCTYPE html>
<html>
<head>
    <title>Painel de Tokens</title>
    <meta charset="UTF-8">
</head>
<body>
    <h2>🔐 Painel de Controle - Tokens</h2>

    <form method="POST" action="/painel">
        <input type="text" name="novo_token" placeholder="Novo Token" required>
        <input type="date" name="expira_em" required>
        <button type="submit">➕ Adicionar Token</button>
    </form>

    <br><br>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Token</th>
                <th>Expira em</th>
                <th>Atualizar</th>
                <th>Excluir</th>
            </tr>
        </thead>
        <tbody>
            {% for token, expira_em in tokens %}
            <tr>
                <td>{{ token }}</td>
                <td>{{ expira_em }}</td>
                <td>
                    <form method="POST" action="/atualizar_token">
                        <input type="hidden" name="token" value="{{ token }}">
                        <input type="date" name="nova_data" required>
                        <button type="submit">💾 Atualizar</button>
                    </form>
                </td>
                <td>
                    <form method="POST" action="/excluir_token">
                        <input type="hidden" name="token" value="{{ token }}">
                        <button type="submit">🗑️ Excluir</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br><br>

    <form action="/exportar_tokens" method="get" style="display:inline;">
        <button type="submit">📤 Exportar Tokens</button>
    </form>

    <form action="/importar_tokens" method="get" style="display:inline;">
        <button type="submit">📥 Importar Tokens</button>
    </form>
</body>
</html>
